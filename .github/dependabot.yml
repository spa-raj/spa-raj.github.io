# Weekly update PRs for the pinned action SHAs and the npm lockfile.
# Review each PR (diff and release notes) before merging; nothing auto-merges.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
